claims:
  - id: vhbb.hbb.decay
    kind: claim
    origin: theory
    statement: "The Higgs boson couples to bottom quarks, providing the H-to-bb decay targeted by the explanation."
    citation:
      arxiv: "hep-ph/0503172"
      doi: "10.1016/j.physrep.2007.10.004"
      locator: "Section 1"
    excerpt: excerpts/theory-hbb.yaml
    context:
      model: SM
      role: decay
    review:
      source: declared
      evidence: retrieved
      value: not_applicable
      interpretation: pending

  - id: vhbb.production.separation
    kind: claim
    origin: theory
    statement: "In VH Higgs-strahlung, the vector boson is produced together with the Higgs, while the bottom-quark pair is attached to the Higgs decay."
    citation:
      arxiv: "hep-ph/0503172"
      doi: "10.1016/j.physrep.2007.10.004"
      locator: "Sections 1 and 3"
    excerpt: excerpts/theory-vh.yaml
    context:
      model: SM
      role: production_vs_decay
    caveats:
      - "The Feynman diagram represents an amplitude topology, not a literal movie in time."
    review:
      source: declared
      evidence: retrieved
      value: not_applicable
      interpretation: pending

  - id: vhbb.strategy.vh
    kind: claim
    origin: measurement
    statement: "VH production supplied the main contribution to the CMS H-to-bb observation result."
    citation:
      arxiv: "1808.08242"
      locator: "Abstract sentence 2 (production)"
    excerpt: excerpts/vh-main.yaml
    context:
      experiment: CMS
      process: VH
      decay: Hbb
    review:
      source: declared
      evidence: retrieved
      value: not_applicable
      interpretation: pending

  - id: vhbb.categories.leptons
    kind: claim
    origin: measurement
    statement: "The VH H-to-bb searches used final states with zero, one, or two charged leptons and two identified bottom-quark jets."
