name: Safety checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s checks/tests -t . -v
      - name: Confidentiality gate
        run: python -m checks.confidentiality scan .
      - name: Language lint
        run: python -m checks.language scan .
