      interpretation: pending

  - id: vhbb.btag.object
    kind: claim
    origin: definition
    statement: "A b jet is a reconstructed jet associated with bottom-quark origin; it is not the bottom quark itself."
    citation:
      arxiv: "1712.07158"
      locator: "Abstract sentence 1"
    excerpt: excerpts/btag.yaml
    context:
      experiment: CMS
      object: b_jet
    caveats:
      - "Identification is probabilistic and can misidentify other jet flavours."
    review:
      source: declared
      evidence: retrieved
      value: not_applicable
      interpretation: pending

